name: Publish To PyPI

on:
  push:
    tags:
       - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set environnment package version from tag
      run: echo "PACKAGE_VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV # extract "1.2.3" from refs/tags/v1.2.3

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install build

    - name: Build wheel
      run: python -m build

    - name: Upload distribution
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  # Kept separate from the build so that only this job can get the OIDC token
  # that PyPI trusted publishing uses instead of an API token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cs3client
    permissions:
      id-token: write

    steps:
    - name: Download distribution
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
